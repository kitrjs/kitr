server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;
  charset_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

  # www.kitr.dev → kitr.dev
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  # Every page as markdown at <url>.md, plus llms.txt, for agents.
  location ~ \.md$ {
    default_type text/markdown;
    types {}
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Prerendered pages live at <path>/index.html; anything else gets the app shell,
  # which renders the right route (and the 404 page) in the browser.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/index.html $uri.html /index.html;
  }
}
