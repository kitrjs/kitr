name: Deploy kitr.dev

# kitr.dev (kitrjs/kitr-site) reads the docs and package pages from this repo at build time, so a
# change on main asks the site to rebuild: a `docs` repository_dispatch starts its Deploy workflow,
# which builds a fresh image against this commit and rolls it out. The site also rebuilds daily, so
# this only makes doc changes show up at once. Does nothing until SITE_DISPATCH_TOKEN is set: a
# fine-grained token for kitrjs/kitr-site with Contents read and write.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**"
  workflow_dispatch:

# Read-only GITHUB_TOKEN: nothing here writes to the repo through it.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask kitrjs/kitr-site to rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            --data '{"event_type":"docs"}' \
            https://api.github.com/repos/kitrjs/kitr-site/dispatches
          echo "Dispatched; the rebuild runs at https://github.com/kitrjs/kitr-site/actions"
