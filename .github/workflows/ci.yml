name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, builds of every package, the registry and the examples, and the bundle checks.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      - name: Build the examples' web platforms (also regenerates route trees)
        run: |
          for app in dashboard fullstack saas site realtime desktop tauri mobile; do
            pnpm -C examples/$app exec kitr build site
          done
          pnpm -C examples/backend exec kitr build api
      - run: pnpm manifests:check
      - run: pnpm readmes:check
      - run: pnpm docs:check --strict
      # Every guide follows docs/STYLE.md; a new or changed guide must too.
      - run: pnpm docs:rules --strict
      - run: pnpm docs:guides --strict
      - name: Generated API pages match the built types
        run: pnpm docs:api --check
      - run: pnpm -C site build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Examples are unmodified kit output
        run: pnpm check:examples
      - name: Production bundle checks
        run: pnpm check:bundles

  # Unit, component and type-level tests, on every supported Node.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # The Redis adapter tests run against a real server here; locally they fall back to ioredis-mock.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The CLI and the examples run for real: kits, generators, add/remove, the backend over the network.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      - run: pnpm test:integration

  # Browsers against production and dev builds: SSR, hydration, isolation, WebSockets, devtools.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # The Electron and Tauri drivers against the real runtimes (secure storage, notifications, plugins).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/tauri/platforms/app/src-tauri
      - name: Linux libraries for Electron, its keyring, and Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0 \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      # electron-builder --dir stops at the unpacked app; the smoke test launches it with Playwright.
      - name: Build the Electron example
        run: pnpm -C examples/desktop exec kitr build app
      - name: Electron smoke test (secure storage round trip, notification call)
        run: tests/electron/run.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-results
          path: test-results/
          retention-days: 7
      # cargo check compiles the scaffold's Rust against every plugin crate without bundling.
      - name: Tauri scaffold compiles
        working-directory: examples/tauri/platforms/app/src-tauri
        run: |
          mkdir -p ../../../dist/app/client && echo '<!doctype html>' > ../../../dist/app/client/index.html
          python3 - <<'PY'
          import struct, zlib
          raw = b''.join(b'\x00' + b'\x20\x60\xc0\xff' * 512 for _ in range(512))
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 512, 512, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('/tmp/app-icon.png', 'wb').write(png)
          PY
          npx --yes @tauri-apps/cli@2 icon /tmp/app-icon.png
          cargo check
