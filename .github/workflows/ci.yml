name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      - run: pnpm -C examples/dashboard build
      - run: pnpm -C examples/fullstack build
      - run: pnpm manifests:check
      - run: pnpm docs:check
      - run: pnpm -C site build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
