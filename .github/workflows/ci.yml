name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, builds of every package, the registry and the examples, and the bundle checks.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      - name: Build the examples' web platforms (also regenerates route trees)
        run: |
          for app in blank dashboard fullstack saas site realtime desktop mobile; do
            pnpm -C examples/$app exec kitr build site
          done
          pnpm -C examples/backend exec kitr build api
      - run: pnpm manifests:check
      - run: pnpm docs:check --strict
      # Warns until every guide follows docs/STYLE.md; the rollout flips it to --strict.
      - run: pnpm docs:rules
      - run: pnpm -C site build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Examples are unmodified kit output
        run: pnpm check:examples
      - name: Production bundle checks
        run: pnpm check:bundles

  # Unit, component and type-level tests, on every supported Node.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The CLI and the examples run for real: kits, generators, add/remove, the backend over the network.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      - run: pnpm test:integration

  # Browsers against production and dev builds: SSR, hydration, isolation, WebSockets, devtools.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C registry build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
